name: Hermes — weekly reflection

# The self-learning deep pass (master prompt level-up): tune the score weights
# against real reply outcomes, decay stale memory, and write global lessons.
# Sunday 23:00 UTC ≈ Sunday 19:00 BOT, before the Monday hunt.

on:
  schedule:
    - cron: '0 23 * * 0'
  workflow_dispatch: {}

concurrency:
  group: hermes-reflect
  cancel-in-progress: false

jobs:
  reflect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hermes
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: hermes/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run deep reflection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_BULK_MODEL: ${{ secrets.LLM_BULK_MODEL }}
          LLM_PITCH_MODEL: ${{ secrets.LLM_PITCH_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TZ: America/La_Paz
        run: pnpm run reflect
